<svg xmlns="http://www.w3.org/2000/svg" width="860" height="580" viewBox="0 0 860 580" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="14">
  <rect width="860" height="580" rx="10" fill="#0d1117"/>
  <rect width="860" height="34" rx="10" fill="#161b22"/>
  <rect y="24" width="860" height="10" fill="#161b22"/>
  <circle cx="20" cy="17" r="6" fill="#ff5f56"/>
  <circle cx="40" cy="17" r="6" fill="#ffbd2e"/>
  <circle cx="60" cy="17" r="6" fill="#27c93f"/>
  <text x="430" y="22" fill="#8b949e" text-anchor="middle">hydra — authorized testing only</text>
  <g>
    <text x="20" y="64" fill="#58a6ff">$ </text><text x="38" y="64" fill="#c9d1d9">hydra doctor</text>
    <text x="20" y="88" fill="#3fb950">[ OK ]</text><text x="74" y="88" fill="#c9d1d9">opencode found</text>
    <text x="20" y="110" fill="#3fb950">[ OK ]</text><text x="74" y="110" fill="#c9d1d9">scope gate: scripts/scope_check.sh</text>
    <text x="20" y="132" fill="#3fb950">[ OK ]</text><text x="74" y="132" fill="#c9d1d9">scope allowlist present</text>
    <text x="20" y="154" fill="#8b949e">doctor: ready</text>

    <text x="20" y="190" fill="#58a6ff">$ </text><text x="38" y="190" fill="#c9d1d9">hydra guard bugbase.ai</text>
    <rect x="20" y="200" width="120" height="20" rx="3" fill="#238636"/>
    <text x="30" y="215" fill="#ffffff" font-weight="bold">SCOPE-ALLOW</text>
    <text x="150" y="215" fill="#8b949e">bugbase.ai  (on allowlist)</text>

    <text x="20" y="250" fill="#58a6ff">$ </text><text x="38" y="250" fill="#c9d1d9">hydra guard evil.invalid</text>
    <rect x="20" y="260" width="110" height="20" rx="3" fill="#da3633"/>
    <text x="30" y="275" fill="#ffffff" font-weight="bold">SCOPE-DENY</text>
    <text x="142" y="275" fill="#8b949e">evil.invalid  (not authorized — blocked, fail-closed)</text>

    <text x="20" y="312" fill="#58a6ff">$ </text><text x="38" y="312" fill="#c9d1d9">hydra providers list</text>
    <text x="20" y="336" fill="#8b949e">ID                 NAME                STATUS</text>
    <text x="20" y="356" fill="#c9d1d9">openrouter         OpenRouter          </text><text x="300" y="356" fill="#d29922">preloaded</text>
    <text x="20" y="376" fill="#c9d1d9">nvidia             NVIDIA NIM          </text><text x="300" y="376" fill="#8b949e">catalog</text>
    <text x="20" y="396" fill="#c9d1d9">groq               Groq                </text><text x="300" y="396" fill="#8b949e">catalog</text>
    <text x="20" y="416" fill="#c9d1d9">google-aistudio    Google AI Studio    </text><text x="300" y="416" fill="#8b949e">catalog</text>
    <text x="20" y="436" fill="#c9d1d9">cerebras           Cerebras            </text><text x="300" y="436" fill="#8b949e">catalog</text>
    <text x="20" y="456" fill="#c9d1d9">ollama             Ollama (local)      </text><text x="300" y="456" fill="#8b949e">catalog</text>
    <text x="20" y="476" fill="#8b949e">… 14 providers · connect with: hydra providers connect &lt;id&gt;</text>

    <text x="20" y="512" fill="#58a6ff">$ </text><text x="38" y="512" fill="#c9d1d9">hydra</text><text x="78" y="512" fill="#8b949e">  # launches the interactive TUI</text>
    <text x="20" y="540" fill="#6e7681">cross-platform single binary · drives opencode v2 · 14 providers</text>
  </g>
</svg>
