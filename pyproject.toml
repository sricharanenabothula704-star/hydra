[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hydra-bounty"
version = "0.3.0"
description = "HYDRA — AI-Powered Bug Bounty System"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.31,<3",
]

[project.scripts]
hydra = "hydra_cli:main"

[tool.setuptools]
py-modules = ["hydra_cli"]

[tool.setuptools.packages.find]
include = ["core*"]
