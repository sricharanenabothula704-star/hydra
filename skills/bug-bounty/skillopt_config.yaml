skill_name: bug-bounty
optimizer:
  learning_rate: 0.1
  validation_split: 0.2
  max_edits_per_epoch: 5
  validator: bug_bounty
seed_skill: |
  # Bug Bounty Hunting Skill
  
  ## reconnaissance
  - Enumerate subdomains using subfinder, amass, assetfinder, crt.sh
  - Use dnsx to resolve and filter live subdomains
  - Check for subdomain takeover opportunities
  - Extract JS bundles for API endpoints and secrets
  - Technology fingerprinting via Wappalyzer, headers, error pages
  - Scope verification per program rules
  
  ## port_scanning
  - Run nmap -sS -T4 --top-ports 1000 on live hosts
  - Identify web services (80, 443, 8080, 8443, 3000, 8000)
  - Service version detection for vulnerability matching
  
  ## web_enumeration
  - Run nuclei with cves/, vulnerabilities/, misconfigurations/ templates
  - Check for common misconfigurations
  - Directory brute force with ffuf
  - API discovery: /api, /v1, /v2, /graphql, /swagger, /openapi.json
  - Check for exposed configs: /.env, /.git, /actuator, /debug
  
  ## vulnerability_analysis
  - Test for OWASP Top 10: XSS, SSRF, IDOR, RCE, SQLi, Auth bypass
  - Focus on: CORS misconfig, rate limiting, JWT weaknesses, cloud metadata SSRF
  - Validate findings with proof-of-concept
  - Check for subdomain takeover via CNAME
  
  ## reporting
  - Document clear steps to reproduce
  - Include impact assessment (Low/Medium/High/Critical)
  - Provide curl commands and screenshots
  - Submit via program platform only
  - Include remediation guidance