name: security-guardrails

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Monthly. The offline attribution checks below run on every build and are
    # blocking. This job needs network access to re-clone upstream, so it is
    # advisory: continue-on-error is deliberate, because a failing provenance
    # check must not be able to fail an ordinary build or block a release.
    #
    # What it actually catches: an upstream force-push or deletion of the pinned
    # commit, an upstream licence change, and accidental local edits that make
    # the "byte-identical to 54a7988" claim false. Treat a red run here as a
    # signal to investigate, not as a build failure.
    - cron: '37 5 1 * *'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Secret pattern scan
        run: |
          # Fail the build if anything secret-shaped is committed.
          PATTERNS=(
            'AIza[0-9A-Za-z_-]{35}'                 # Google API keys
            'AKIA[0-9A-Z]{16}'                      # AWS access keys
            'ghp_[A-Za-z0-9]{36}'                   # GitHub tokens
            'github_pat_[A-Za-z0-9_]{20,}'          # GitHub fine-grained PATs
            'sk_live_[0-9a-zA-Z]{16,}'              # Stripe live keys
            'xox[baprs]-[A-Za-z0-9-]{10,}'          # Slack tokens
            '^-----BEGIN (RSA|EC|OPENSSH|DSA|PGP) PRIVATE KEY-----[[:space:]]*$'
            '[A-Za-z0-9._%+-]+@(gmail|outlook|yahoo)\.[a-z]{2,}'  # personal emails
          )
          VIOLATIONS=0
          for p in "${PATTERNS[@]}"; do
            HITS=$( { grep -rnE -e "$p" . \
              --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=__pycache__ \
              --exclude="*.lock" --exclude="package-lock.json" 2>/dev/null \
              | grep -vE 'EXAMPLE|X{6,}|EXPOSEDKEY|YOUR[_-]|<your|placeholder'; } || true )
            # This is the project's intentionally public reporting contact,
            # not a credential. Keep the exception exact; do not allowlist a domain.
            if [[ "$p" == *"gmail"* ]]; then
              HITS=$(printf '%s\n' "$HITS" | grep -vF 'sricharan996@gmail.com' || true)
            fi
            if [ -n "$HITS" ]; then
              echo "::error::Secret-pattern match ($p):"
              echo "$HITS" | head -5
              VIOLATIONS=1
            fi
          done
          [ "$VIOLATIONS" -eq 0 ] && echo "✅ No secret-shaped content found." || exit 1

      - name: Bash syntax check
        run: |
          FAIL=0
          while IFS= read -r f; do
            bash -n "$f" || { echo "::error::Syntax error in $f"; FAIL=1; }
          done < <(find . -name "*.sh" -not -path "./.git/*")
          [ "$FAIL" -eq 0 ] && echo "✅ All shell scripts parse." || exit 1

      - name: Python compile check
        run: |
          FAIL=0
          while IFS= read -r f; do
            python3 -m py_compile "$f" 2>/dev/null || { echo "::error::Compile error in $f"; FAIL=1; }
          done < <(find . -name "*.py" -not -path "./.git/*")
          [ "$FAIL" -eq 0 ] && echo "✅ All Python files compile." || exit 1

      - name: Skill index consistency
        run: python3 scripts/validate_skill_index.py

      - name: Third-party skill attribution
        # 808 of the 1179 modules are Apache-2.0 works from
        # mukul975/Anthropic-Cybersecurity-Skills. Apache-2.0 section 4
        # requires the license, retained author attribution, and declared
        # modifications. This check fails if any of that is stripped, or if a
        # future import adds an Apache module without recording it.
        run: python3 scripts/verify_skill_attribution.py

      - name: Core unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Scope shell policy tests
        run: bash tests/test_scope_check.sh

      - name: Agent frontmatter check
        run: |
          FAIL=0
          for f in agents/*.md; do
            head -1 "$f" | grep -q '^---' || { echo "::error::$f missing YAML frontmatter"; FAIL=1; }
          done
          [ "$FAIL" -eq 0 ] && echo "✅ All agent definitions valid." || exit 1

      - name: Skill supply-chain scan
        # The skill corpus executes with implicit trust, so new critical
        # patterns are blocked. Known-intentional matches are suppressed in
        # .skill-scan-suppressions.json with a written reason per file+rule.
        run: python3 scripts/skill_supply_chain_scan.py --fail-on critical

      - name: Enforcement gate evaluation
        # Guards the published 43/43 number against silent regression.
        run: |
          OUT="$(python3 -m core.evaluation_harness)"
          echo "$OUT"
          echo "$OUT" | grep -q "FAILED" && { echo "::error::enforcement gates regressed"; exit 1; }
          echo "$OUT" | grep -q "OVERALL     43/43" \
            || { echo "::error::expected 43/43; update docs/ENFORCEMENT.md if intentionally changed"; exit 1; }
          echo "✅ Enforcement gates at published baseline."

  # Advisory only. Needs network access to re-clone upstream, so it runs on a
  # schedule and cannot fail a normal build.
  provenance:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Compare skill corpus against pinned upstream commit
        continue-on-error: true
        run: |
          set +e
          python3 scripts/verify_skill_provenance.py
          STATUS=$?
          set -e
          if [ "$STATUS" -eq 2 ]; then
            echo "::warning::could not reach upstream (network or pinned commit gone). Investigate: was 54a7988 force-pushed or deleted?"
          elif [ "$STATUS" -ne 0 ]; then
            echo "::error::provenance drift: the 808 modules are no longer byte-identical to the pinned upstream commit"
            echo "::error::either a local edit or an upstream history rewrite. See THIRD_PARTY_NOTICES.md before changing the claim."
          else
            echo "✅ Provenance holds at the pinned commit."
          fi
          exit 0
